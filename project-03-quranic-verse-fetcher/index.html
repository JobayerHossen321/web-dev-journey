<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Surah Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1 id="surah-title">Select a Surah</h1>
        
        <!-- Controls Header -->
        <div class="controls">
            <select id="surah-select">
                <option value="1">1. Al-Faatiha</option>
                <option value="108">108. Al-Kawthar</option>
                <option value="112">112. Al-Ikhlaas</option>
                <option value="113">113. Al-Falaq</option>
                <option value="114">114. An-Naas</option>
            </select>
            <button id="fetch-btn">Load Surah</button>
        </div>

        <!-- Status Message -->
        <p id="status-msg" class="status"></p>

        <!-- Container for ALL Ayahs -->
        <div id="surah-container" class="ayah-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
