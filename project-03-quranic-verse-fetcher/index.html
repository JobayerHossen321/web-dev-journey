<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Surah Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1 id="surah-title">Loading Surah List...</h1>
        
        <!-- Controls Header -->
        <div class="controls">
            <!-- Empty select element - script.js will fill this with all 114 Surahs -->
            <select id="surah-select"></select>
            <button id="fetch-btn">Load Surah</button>
        </div>

        <!-- Status Message -->
        <p id="status-msg" class="status"></p>

        <!-- Container for ALL Ayahs -->
        <div id="surah-container" class="ayah-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
